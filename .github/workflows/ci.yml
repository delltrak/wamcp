name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      # Exercise real media conversion on one matrix leg; other runtimes still run
      # the complete unit suite and codec-aware tests when codecs are available.
      - name: Install media conversion codecs
        if: matrix.node-version == '26.x'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libwebp_anim

      - name: Test
        run: npm test

      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
