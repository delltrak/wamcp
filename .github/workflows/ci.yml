name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  postgres:
    name: Postgres storage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wamcp
          POSTGRES_PASSWORD: wamcp
          POSTGRES_DB: wamcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wamcp -d wamcp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WA_DATABASE_URL: postgres://wamcp:wamcp@localhost:5432/wamcp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate Postgres
        run: npm run db:migrate

      - name: Test
        run: npm test
