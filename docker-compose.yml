services:
  wa-mcp:
    build: .
    container_name: wa-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # The image does not set a time zone, so the container clock is UTC unless you set one.
      # - TZ=America/Bahia
      - WA_TRANSPORT=http
      - WA_MCP_PORT=3000
      - WA_BASE_PATH=${WA_BASE_PATH:-}
      - WA_BASIC_AUTH=${WA_BASIC_AUTH:-}
      - WA_MCP_OAUTH_ENABLED=${WA_MCP_OAUTH_ENABLED:-false}
      - WA_MCP_OAUTH_ISSUER_URL=${WA_MCP_OAUTH_ISSUER_URL:-}
      - WA_MCP_OAUTH_RESOURCE_URL=${WA_MCP_OAUTH_RESOURCE_URL:-}
      - WA_MCP_OAUTH_DB_PATH=${WA_MCP_OAUTH_DB_PATH:-data/oauth.db}
      - WA_MCP_OAUTH_DCR=${WA_MCP_OAUTH_DCR:-open}
      - WA_MCP_OAUTH_REDIRECT_HOST_ALLOWLIST=${WA_MCP_OAUTH_REDIRECT_HOST_ALLOWLIST:-}
      - WA_TRUST_PROXY=${WA_TRUST_PROXY:-}
      - WA_DASHBOARD_ENABLED=${WA_DASHBOARD_ENABLED:-false}
      - WA_DASHBOARD_USERS=${WA_DASHBOARD_USERS:-}
      - WA_REDIS_URL=redis://redis:6379
      - WA_LOG_LEVEL=info
      - WA_MESSAGE_RETENTION_DAYS=30
      - WA_DATABASE_PATH=${WA_DATABASE_PATH:-data/whatsapp.db}
      - WA_DATABASE_URL=${WA_DATABASE_URL:-}
      - WA_BAILEYS_HISTORY_SYNC_MAX_MESSAGES=${WA_BAILEYS_HISTORY_SYNC_MAX_MESSAGES:-100}
      - WA_BAILEYS_RATE_LIMIT=20
      - WA_PROXY_URL=${WA_PROXY_URL:-}
      - WA_PRESENCE_MODE=${WA_PRESENCE_MODE:-on_activity}
      - WA_APP_STATE_WRITES_ENABLED=${WA_APP_STATE_WRITES_ENABLED:-false}
      - WA_GROUP_WRITES_ENABLED=${WA_GROUP_WRITES_ENABLED:-false}
      - WA_SCHEDULER_ENABLED=${WA_SCHEDULER_ENABLED:-false}
      - WA_SCHEDULER_MISSED_POLICY=${WA_SCHEDULER_MISSED_POLICY:-skip}
      - WA_SCHEDULER_MAX_ACTIVE=${WA_SCHEDULER_MAX_ACTIVE:-100}
      - WA_GROUP_HISTORY_ON_JOIN=${WA_GROUP_HISTORY_ON_JOIN:-false}
      - WA_GROUP_HISTORY_ON_JOIN_COUNT=${WA_GROUP_HISTORY_ON_JOIN_COUNT:-50}
      - WA_APP_STATE_MIN_INTERVAL_MS=${WA_APP_STATE_MIN_INTERVAL_MS:-1500}
      - WA_PRESENCE_IDLE_SECONDS=${WA_PRESENCE_IDLE_SECONDS:-30}
      - WA_MARK_ONLINE_ON_CONNECT=${WA_MARK_ONLINE_ON_CONNECT:-false}
      - WA_AUTO_REPLY_ENABLED=${WA_AUTO_REPLY_ENABLED:-false}
      - WA_AUTO_REPLY_TEXT=${WA_AUTO_REPLY_TEXT:-}
      - WA_AUTO_REPLY_COOLDOWN_HOURS=${WA_AUTO_REPLY_COOLDOWN_HOURS:-24}
      - WA_AUTO_REPLY_MAX_AGE_SECONDS=${WA_AUTO_REPLY_MAX_AGE_SECONDS:-180}
      - WA_AUTO_REPLY_IGNORE_JIDS=${WA_AUTO_REPLY_IGNORE_JIDS:-}
      - WA_AUTO_REPLY_GROUPS=${WA_AUTO_REPLY_GROUPS:-false}
      - WA_AUTO_REPLY_RATE_PER_MINUTE=${WA_AUTO_REPLY_RATE_PER_MINUTE:-6}
      - WA_AUTO_REPLY_INSTANCES=${WA_AUTO_REPLY_INSTANCES:-}
      - WA_PRESENCE_PULSE_ENABLED=${WA_PRESENCE_PULSE_ENABLED:-false}
      - WA_PRESENCE_PULSE_TIMES_PER_DAY=${WA_PRESENCE_PULSE_TIMES_PER_DAY:-2}
      - WA_PRESENCE_PULSE_MINUTES=${WA_PRESENCE_PULSE_MINUTES:-5}
      - WA_PRESENCE_PULSE_WINDOW=${WA_PRESENCE_PULSE_WINDOW:-08:00-22:00}
      - WA_PRESENCE_PULSE_TZ=${WA_PRESENCE_PULSE_TZ:-}
      - WA_AUTO_MARK_PLAYED=${WA_AUTO_MARK_PLAYED:-false}
      - WA_TTS_ENABLED=${WA_TTS_ENABLED:-false}
      - WA_TTS_PROVIDER=${WA_TTS_PROVIDER:-elevenlabs}
      - WA_TTS_API_KEY=${WA_TTS_API_KEY:-}
      - WA_TTS_DEFAULT_VOICE_ID=${WA_TTS_DEFAULT_VOICE_ID:-}
      - WA_TTS_MODEL=${WA_TTS_MODEL:-eleven_v3}
      - WA_TTS_LANGUAGE=${WA_TTS_LANGUAGE:-}
      - WA_TTS_OUTPUT_FORMAT=${WA_TTS_OUTPUT_FORMAT:-opus_48000_64}
      - WA_TTS_MAX_CHARS=${WA_TTS_MAX_CHARS:-5000}
      - WA_TTS_BASE_URL=${WA_TTS_BASE_URL:-https://api.elevenlabs.io}
      - WA_TTS_TIMEOUT_MS=${WA_TTS_TIMEOUT_MS:-60000}
      - TTS_CONCURRENCY=${TTS_CONCURRENCY:-2}
      - WA_TTS_FFMPEG_PATH=${WA_TTS_FFMPEG_PATH:-}
      - WA_MEDIA_COMPRESS=${WA_MEDIA_COMPRESS:-false}
      - WA_MEDIA_IMAGE_MAX_EDGE=${WA_MEDIA_IMAGE_MAX_EDGE:-600}
      - WA_MEDIA_IMAGE_QUALITY=${WA_MEDIA_IMAGE_QUALITY:-75}
      - WA_MEDIA_VIDEO_MAX_EDGE=${WA_MEDIA_VIDEO_MAX_EDGE:-720}
      - WA_MEDIA_VIDEO_CRF=${WA_MEDIA_VIDEO_CRF:-28}
      - WA_REQUIRE_EVENT_WEBHOOK=${WA_REQUIRE_EVENT_WEBHOOK:-false}
      - WA_CHATWOOT_ENABLED=${WA_CHATWOOT_ENABLED:-false}
      - WA_CHATWOOT_URL=${WA_CHATWOOT_URL:-}
      - WA_CHATWOOT_TOKEN=${WA_CHATWOOT_TOKEN:-}
      - WA_CHATWOOT_ACCOUNT_ID=${WA_CHATWOOT_ACCOUNT_ID:-}
      - WA_CHATWOOT_INBOX_ID=${WA_CHATWOOT_INBOX_ID:-}
      - WA_CHATWOOT_WEBHOOK_SECRET=${WA_CHATWOOT_WEBHOOK_SECRET:-}
      - WA_CHATWOOT_IGNORE_JIDS=${WA_CHATWOOT_IGNORE_JIDS:-}
      - WA_CHATWOOT_INSTANCE_ID=${WA_CHATWOOT_INSTANCE_ID:-}
      - WA_CHATWOOT_ALLOW_HTTP=${WA_CHATWOOT_ALLOW_HTTP:-false}
      - WA_CHATWOOT_ALLOW_PRIVATE_URL=${WA_CHATWOOT_ALLOW_PRIVATE_URL:-false}
      - WA_CHATWOOT_ALLOW_LEGACY_SECRET=${WA_CHATWOOT_ALLOW_LEGACY_SECRET:-false}
      - WA_CHATWOOT_BLOCK_GROUP_REPLIES=${WA_CHATWOOT_BLOCK_GROUP_REPLIES:-false}
      - WA_CHATWOOT_TIMEOUT_MS=${WA_CHATWOOT_TIMEOUT_MS:-10000}
    volumes:
      - ${WA_DATA_DIR:-wa-data}:/app/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
        required: false

  redis:
    image: redis:7-alpine
    container_name: wa-mcp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # Opt-in only. `docker compose up` does not start Postgres or move the SQLite file.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    container_name: wa-mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wamcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-wamcp}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - wa-pg-data:/var/lib/postgresql/data

volumes:
  wa-data:
  redis-data:
  wa-pg-data:
